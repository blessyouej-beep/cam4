function storeField(){if($('nameField'))state.name=$('nameField').value;if($('customJob'))state.customJob=$('customJob').value.trim();}
function recordedLength(){
 if(!state.clipUrl)return 0;
 const meta=state.clipVideo?.duration;
 // Use the actual captured elapsed time. MediaRecorder WebM metadata can
 // report Infinity or an inaccurate duration until the recording is finalized.
 const measured=Number(state.clipDuration);
 const guessed=Number.isFinite(measured)&&measured>0.2?measured:meta;
 return Math.max(0.4,Number(guessed)||5);
}
function duration(){return types[state.videoType].secs+recordedLength();}
function fmt(seconds){let s=Math.floor(Number(seconds)||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function handlePhoto(file){
 if(!file)return;
 if(!file.type.startsWith('image/')){alert('사진 파일을 읽지 못했어요.');return;}
 let url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{
  if(state.clipVideo)state.clipVideo.pause();if(state.clipUrl)URL.revokeObjectURL(state.clipUrl);
  state.clipUrl='';state.clipBlob=null;state.clipVideo=null;state.clipAudio=false;state.clipDuration=0;
  if(state.photoUrl)URL.revokeObjectURL(state.photoUrl);
  state.photoBlob=file;state.photoUrl=url;state.photoImage=img;render();
 };
 img.onerror=()=>{URL.revokeObjectURL(url);alert('촬영한 사진을 표시할 수 없어요. 다시 찍어 주세요.');};
 img.src=url;
}
function handleClip(file,hasAudio,recordedSeconds){
 if(!file)return;
 if(!file.type.startsWith('video/')){alert('동영상 파일을 읽지 못했어요.');return;}
 const url=URL.createObjectURL(file),v=document.createElement('video');
 v.src=url;v.muted=false;v.playsInline=true;v.loop=false;v.preload='auto';
 v.onloadeddata=()=>{
  if(state.clipVideo)state.clipVideo.pause();if(state.clipUrl)URL.revokeObjectURL(state.clipUrl);
  if(state.photoUrl)URL.revokeObjectURL(state.photoUrl);
  state.photoUrl='';state.photoImage=null;state.photoBlob=null;
  state.clipUrl=url;state.clipBlob=file;state.clipVideo=v;state.clipAudio=!!hasAudio;state.clipDuration=Math.max(.4,(Number(recordedSeconds)>0 ? Number(recordedSeconds) : (Number.isFinite(v.duration)&&v.duration>0 ? v.duration : 5)));render();
 };
 v.onerror=()=>{URL.revokeObjectURL(url);alert('촬영 영상 미리보기를 열지 못했어요. 다시 촬영해 주세요.');};
 v.load();
}
function cameraOverlay(){

 document.body.appendChild(o);

 o.querySelector('#camClose').addEventListener('click',closeCamera);
 o.querySelector('#camFeed').addEventListener('click',()=>{const v=$('camFeed');if(v?.paused)v.play().catch(()=>{});});
 return o;
}
function explainMediaError(err,kind){
 const n=err?.name||'Error';
 if(!isSecureContext||!navigator.mediaDevices?.getUserMedia)return '카메라를 사용할 수 없는 실행 환경이에요. HTTPS 배포 주소를 새 탭에서 열어 주세요. 앱 미리보기 창에서는 제한될 수 있어요.';
 if(n==='NotAllowedError'||n==='PermissionDeniedError'||n==='SecurityError')return kind+' 권한을 확인해 주세요. 브라우저 주소창과 기기 설정에서 허용하고 새로고침해 주세요. 앱 미리보기 창이라면 사이트를 새 탭에서 여세요.';
 if(n==='NotFoundError'||n==='DevicesNotFoundError')return kind+' 장치를 찾지 못했어요. 카메라·마이크 연결을 확인해 주세요.';
 if(n==='NotReadableError'||n==='TrackStartError')return kind+' 장치가 다른 프로그램에서 사용 중이거나 실행되지 않았어요. 화상회의 앱을 닫고 다시 시도해 주세요.';
 if(n==='OverconstrainedError')return '카메라 설정을 사용할 수 없어요. 다른 카메라를 사용해 주세요.';
 if(n==='AbortError')return '카메라 연결이 중단됐어요. 다시 시도해 주세요.';
 return kind+' 연결 실패 ('+n+'): '+(err?.message||'장치 설정을 확인해 주세요.');
}
async function openCamera(mode){
 closeCamera();const token=cameraSession;cameraMode=mode;cameraHasAudio=false;
 const o=cameraOverlay(),status=o.querySelector('#camStatus'),shoot=o.querySelector('#camShoot'),stop=o.querySelector('#camStop'),v=o.querySelector('#camFeed');
 o.style.display='flex';o.querySelector('#camHeading').textContent=mode==='photo'?'📷 PHOTO · 사진 촬영':'🎥 REC · 동영상 촬영';
 status.textContent='카메라 연결 중... 처음에는 브라우저에서 사용 권한을 허용해 주세요.';
 shoot.textContent=mode==='photo'?'📷 사진 찍기':'🔴 동영상 촬영 시작';shoot.disabled=true;stop.classList.add('hide');stop.disabled=false;
 try{
  if(!isSecureContext||!navigator.mediaDevices?.getUserMedia)throw new Error('HTTPS 주소로 접속해야 카메라를 사용할 수 있어요.');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}},audio:false});
  if(token!==cameraSession){stream.getTracks().forEach(t=>t.stop());return;}
  cameraStream=stream;v.srcObject=stream;
  // Preview playback may be blocked even when the camera stream is connected. Don't confuse the two errors.
  try{await v.play();}catch(err){status.textContent='카메라가 연결됐어요. 화면이 멈춰 있다면 영상 화면을 한 번 눌러 주세요.';}
  if(token!==cameraSession)return;
  if(mode==='video'){
   status.textContent='카메라 연결 완료. 마이크 연결 중...';
   try{
    const mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    if(token!==cameraSession){mic.getTracks().forEach(t=>t.stop());return;}
    mic.getAudioTracks().forEach(t=>stream.addTrack(t));cameraHasAudio=mic.getAudioTracks().length>0;
    status.textContent='✅ 카메라·마이크 연결됨. 녹화를 시작하고 끝내고 싶을 때 촬영 끝내기를 누르세요.';
   }catch(err){status.textContent='⚠️ 카메라만 연결됐어요. '+explainMediaError(err,'마이크')+' 소리 없이 촬영하려면 촬영 시작을 누르세요.';}
  }else status.textContent='✅ 카메라 연결됨. 화면을 확인하고 사진을 찍어 주세요.';
  shoot.disabled=false;
 }catch(err){if(token!==cameraSession)return;status.textContent=explainMediaError(err,'카메라');if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}}
}
function cameraShoot(){
 const o=cameraOverlay(),v=o.querySelector('#camFeed'),status=o.querySelector('#camStatus');
 if(!cameraStream)return;
 if(cameraMode==='photo'){
  if(v.readyState<2||!v.videoWidth){status.textContent='카메라 화면을 준비하는 중이에요. 잠시 후 다시 눌러 주세요.';return;}
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  o.querySelector('#camShoot').disabled=true;
  c.toBlob(blob=>{if(!blob){status.textContent='사진을 저장하지 못했어요. 다시 찍어 주세요.';o.querySelector('#camShoot').disabled=false;return;}
   closeCamera();handlePhoto(new File([blob],'나의미래_사진.png',{type:'image/png'}));},'image/png');return;
 }
 if(!window.MediaRecorder){status.textContent='이 브라우저는 동영상 촬영을 지원하지 않아요. PC 크롬 또는 엣지에서 다시 시도해 주세요.';return;}
 const mime=['video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(x=>MediaRecorder.isTypeSupported(x))||'';
